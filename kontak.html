<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontak - Toko Buku Najwah Febi</title>

<style>

/* ===== BODY ===== */
body{
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin:0;
background:linear-gradient(135deg,#eef2f3,#dfe9f3);
color:#333;
}

/* ===== NAVBAR ===== */
nav{
background:#2c3e50;
padding:15px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:16px;
padding:8px 15px;
border-radius:6px;
position:relative;
transition:0.3s;
}

/* animasi garis */
nav a::after{
content:"";
position:absolute;
width:0;
height:3px;
left:0;
bottom:-5px;
background:#3498db;
transition:0.3s;
}

nav a:hover::after{
width:100%;
}

nav a:hover{
color:#3498db;
transform:translateY(-2px);
}

/* ===== CONTAINER ===== */
.container{
width:420px;
margin:50px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
animation:muncul 0.8s ease;
}

@keyframes muncul{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* ===== JUDUL ===== */
h2{
text-align:center;
color:#2c3e50;
}

/* ===== INPUT ===== */
input, textarea{
width:100%;
padding:8px;
border-radius:6px;
border:1px solid #ccc;
margin-top:5px;
margin-bottom:15px;
font-size:14px;
}

/* ===== BUTTON ===== */
button{
width:100%;
padding:10px;
background:#3498db;
border:none;
color:white;
font-size:15px;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2980b9;
transform:scale(1.03);
}

/* ===== STORE INFO ===== */
.store-info{
background:#f7f9fc;
padding:15px;
border-radius:8px;
margin-bottom:20px;
}

/* ===== FOOTER ===== */
footer{
text-align:center;
padding:15px;
background:#2c3e50;
color:white;
margin-top:40px;
}

</style>
</head>

<body>
