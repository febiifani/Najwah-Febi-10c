<style>

/* ===== BODY ===== */
body{
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin:0;
background:linear-gradient(135deg,#eef2f3,#dfe9f3);
color:#333;
}

/* ===== HEADER ===== */
header img{
width:100%;
height:300px;
object-fit:cover;
}

/* ===== NAVBAR ===== */
nav{
background:#2c3e50;
padding:15px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
position:sticky;
top:0;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:16px;
padding:8px 15px;
border-radius:6px;
position:relative;
transition:0.3s;
}

nav a::after{
content:"";
position:absolute;
width:0;
height:3px;
left:0;
bottom:-5px;
background:#3498db;
transition:0.3s;
}

nav a:hover::after{
width:100%;
}

nav a:hover{
color:#3498db;
transform:translateY(-2px);
}

/* ===== CONTAINER ===== */
.container{
max-width:800px;
margin:50px auto;
padding:25px;
background:white;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
animation:muncul 0.8s ease;
}

/* animasi */
@keyframes muncul{
from{opacity:0; transform:translateY(40px);}
to{opacity:1; transform:translateY(0);}
}

/* ===== BOX INFO TOKO ===== */
.info-toko{
background:#f7f9fc;
padding:15px 20px;
border-left:6px solid #3498db;
border-radius:10px;
margin-bottom:20px;
}

/* ===== FORM ===== */
form{
display:flex;
flex-direction:column;
gap:10px;
}

input, textarea{
padding:10px;
border:1px solid #ccc;
border-radius:6px;
font-size:14px;
outline:none;
transition:0.3s;
}

input:focus, textarea:focus{
border-color:#3498db;
box-shadow:0 0 8px rgba(52,152,219,0.3);
}

/* ===== BUTTON ===== */
button{
padding:10px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#2980b9;
transform:scale(1.03);
}

/* ===== TITLE ===== */
h1{
text-align:center;
color:#2c3e50;
}

/* ===== FOOTER ===== */
footer{
text-align:center;
padding:15px;
background:#2c3e50;
color:white;
margin-top:40px;
}

</style>
</head>
