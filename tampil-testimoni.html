<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimoni Pembeli - Toko Buku Najwah Febi</title>

<style>

/* ===== BODY ===== */
body{
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin:0;
background:linear-gradient(135deg,#eef2f3,#dfe9f3);
color:#333;
}

/* ===== NAVBAR ===== */
nav{
margin-top:10px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
padding:8px 15px;
border-radius:6px;
font-size:16px;
position:relative;
transition:0.3s;
}

/* animasi garis */
nav a::after{
content:"";
position:absolute;
left:0;
bottom:-4px;
width:0;
height:3px;
background:#3498db;
transition:0.3s;
}

nav a:hover::after{
width:100%;
}

nav a:hover{
color:#3498db;
transform:translateY(-2px);
}

/* ===== HEADER ===== */
header img{
width:100%;
height:300px;
object-fit:cover;
}

/* ===== CONTAINER ===== */
.formulir{
max-width:800px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
animation:muncul 0.8s ease;
}

@keyframes muncul{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}
  
/* ===== TESTIMONI CARD ===== */
.testimoni-box{
background:#f9fbff;
padding:20px;
margin-bottom:20px;
border-left:6px solid #3498db;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
transition:0.3s;
}

.testimoni-box:hover{
transform:translateY(-4px);
box-shadow:0 8px 18px rgba(0,0,0,0.15);
}

/* ===== BUTTON ===== */
button{
display:block;
margin:20px auto;
padding:12px 20px;
border:none;
border-radius:8px;
background:#e74c3c;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#c0392b;
transform:scale(1.05);
}

/* ===== FOOTER ===== */
footer{
text-align:center;
padding:15px;
background:#2c3e50;
color:white;
margin-top:40px;
}

</style>
</head>

<body>
  
<header>
<img src="header 3.jpg" alt="Header Toko Buku"/>
</header>

<nav>
<a href="index.html">Beranda</a>
<a href="produk.html">Produk</a>
<a href="bedah-buku.html">Bedah Buku</a>
<a href="testimoni.html">Testimoni</a>
<a href="tampil-testimoni.html">Testimoni Pembeli</a>
<a href="kontak.html">Kontak</a>
<a href="event.html">Event</a>
</nav>

<h1>Toko Buku Najwah Febi</h1>

<main class="formulir">

<h2>Testimoni Pembeli</h2>

<div id="daftarTestimoni"></div>

<button id="hapusSemua">Hapus Semua Testimoni</button>

</main>

<footer>
<p>&copy; 2026 Toko Buku Najwah Febi</p>
</footer>

<script>

const container = document.getElementById('daftarTestimoni');

const testimoniList =
JSON.parse(localStorage.getItem('testimoniList')) || [];

if(testimoniList.length === 0){

container.innerHTML = "<p>Belum ada testimoni.</p>";

}else{

testimoniList.forEach((t)=>{

const el = document.createElement('div');

el.className = "testimoni-box";

el.innerHTML = `
<p><strong>Nama:</strong> ${t.nama}</p>
<p><strong>Email:</strong> ${t.email}</p>
<p><strong>Pesan:</strong> ${t.pesan}</p>
<p><strong>Asal:</strong> ${t.asal}</p>
<p><strong>Judul Buku:</strong> ${t.Judul}</p>
<p><strong>Rating:</strong> ${t.rating}</p>
`;

container.appendChild(el);

});

}

document.getElementById("hapusSemua").addEventListener("click",function(){

const konfirmasi = confirm("Apakah anda yakin ingin menghapus semua testimoni?");

if(konfirmasi){

localStorage.removeItem("testimoniList");

location.reload();

}

});

</script>

</body>
</html>
