<!DOCTYPE html>
<html lang="id">
<head> 
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Testimoni - Toko Buku Najwah Febi</title>

<style>

/* ===== BODY ===== */
body{
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
margin:0;
background:linear-gradient(135deg,#eef2f3,#dfe9f3);
color:#333;
}

/* ===== HEADER ===== */
header img{
width:100%;
height:300px;
object-fit:cover;
}

/* ===== NAVBAR ===== */
nav{
background:#2c3e50;
padding:15px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:16px;
padding:8px 15px;
border-radius:6px;
position:relative;
transition:0.3s;
}

/* animasi garis */
nav a::after{
content:"";
position:absolute;
width:0;
height:3px;
left:0;
bottom:-4px;
background:#3498db;
transition:0.3s;
}

nav a:hover::after{
width:100%;
}

nav a:hover{
transform:translateY(-2px);
color:#3498db;
}

/* ===== JUDUL ===== */
h1{
text-align:center;
margin-top:30px;
color:#2c3e50;
}

/* ===== FORM CARD ===== */
.formulir{
max-width:600px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
animation:muncul 0.8s ease;
}

@keyframes muncul{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* ===== LABEL ===== */
form label{
display:block;
margin-top:15px;
font-weight:600;
color:#555;
}

/* ===== INPUT ===== */
form input,
form textarea{
width:100%;
padding:10px;
margin-top:6px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
transition:0.3s;
}

/* animasi fokus */
form input:focus,
form textarea:focus{
border-color:#3498db;
outline:none;
box-shadow:0 0 6px rgba(52,152,219,0.4);
}

/* ===== BUTTON ===== */
button{
margin-top:20px;
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#3498db;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#217dbb;
transform:scale(1.03);
}

/* ===== FOOTER ===== */
footer{
margin-top:40px;
background:#2c3e50;
color:white;
text-align:center;
padding:15px;
font-size:14px;
}

</style>
</head>

<body>

<nav>
<a href="index.html">Beranda</a>
<a href="produk.html">Produk</a>
<a href="bedah-buku.html">Bedah Buku</a>
<a href="testimoni.html">Testimoni</a>
<a href="tampil-testimoni.html">Testimoni Pembeli</a>
<a href="kontak.html">Kontak</a>
<a href="event.html">Event</a>
</nav>

<h1>Toko Buku Najwah Febi</h1>

<main class="formulir">

<h2>Berikan Testimoni Anda</h2>

<form id="formTestimoni">

<label for="nama">Nama:</label>
<input type="text" id="nama" name="nama" required placeholder="Nama Lengkap">

<label for="email">Email:</label>
<input type="email" id="email" name="email" required placeholder="email@example.com">

<label for="pesan">Testimoni Anda:</label>
<textarea id="pesan" name="pesan" required placeholder="Tulis Pengalaman Anda..." rows="5"></textarea>

<label for="asal">Asal sekolah/instansi/komunitas:</label>
<input type="text" id="asal" name="asal" required placeholder="contoh: SMA Alkautsar">

<label for="Judul">Judul buku yang dibeli:</label>
<input type="text" id="Judul" name="Judul">

<label for="rating">Rating buku:</label>
<input type="number" id="rating" name="rating" required placeholder="1-10">

<button type="submit">Kirim Testimoni</button>

</form>

</main>

<footer>
<p>&copy; 2026 Toko Buku Najwah Febi</p>
</footer>

<script>

document.getElementById('formTestimoni').addEventListener('submit', function(e){
e.preventDefault();

const nama = document.getElementById('nama').value;
const email = document.getElementById('email').value;
const pesan = document.getElementById('pesan').value;
const asal = document.getElementById('asal').value;
const Judul = document.getElementById('Judul').value;
const rating = document.getElementById('rating').value;

const dataBaru = { nama,email,pesan,asal,Judul,rating };

const testimoniList = JSON.parse(localStorage.getItem('testimoniList')) ||[];

testimoniList.push(dataBaru);

localStorage.setItem('testimoniList', JSON.stringify(testimoniList));

window.location.href = 'proses-testimoni.html';

});

</script>

</body>
</html>
